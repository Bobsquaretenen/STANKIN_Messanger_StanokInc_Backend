<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт - СТАНКИН</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4a5a90',
                        'primary-hover': '#3b4d96',
                        'text-main': '#1f2937',
                        'text-muted': '#6b7280',
                        'border-base': '#d1d5db',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    borderRadius: { 'card': '18px', 'field': '12px' },
                    boxShadow: {
                        'card': '0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.05)',
                        'btn': '0 4px 6px -1px rgba(74,90,144,0.3)',
                        'back': '0 6px 16px -4px rgba(74,90,144,0.4), 0 4px 6px -2px rgba(74,90,144,0.2)',
                        'back-hover': '0 10px 20px -4px rgba(74,90,144,0.5), 0 6px 8px -2px rgba(74,90,144,0.3)',
                    },
                }
            }
        }
    </script>
    <style>
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body class="font-sans h-screen flex items-center justify-center relative overflow-hidden text-text-main
             bg-[linear-gradient(135deg,#e0e7ff_0%,#f3e8ff_50%,#dbeafe_100%)]">

<div class="absolute top-10 left-10 flex items-center z-10 max-sm:top-5 max-sm:left-5">
    <img src="logo-stankin.png" alt="СТАНКИН" class="h-[50px] w-auto object-contain">
</div>

<div class="bg-white/70 backdrop-blur-md border border-white/80 rounded-card
                pt-[30px] px-[50px] pb-[45px] w-full max-w-[440px]
                shadow-card flex flex-col relative z-[5]
                max-sm:pt-[25px] max-sm:px-[25px] max-sm:pb-[35px] max-sm:m-5">

    <h1 class="text-2xl font-semibold mb-[25px] text-text-main leading-tight max-sm:text-xl">
        Вход в аккаунт <span id="role-title">преподавателя</span>
    </h1>

    <form id="loginForm">
        <div class="flex flex-col mb-[18px]">
            <label for="login" class="text-sm font-medium text-text-muted mb-2">Логин</label>
            <input type="text" id="login" placeholder="Введите логин"
                   class="w-full py-[14px] px-4 rounded-field border border-border-base
                              bg-white/60 text-[15px] font-sans text-text-main outline-none
                              transition-[border-color,background] duration-200
                              focus:border-primary focus:bg-white">
        </div>

        <div class="flex flex-col mb-[18px]">
            <label for="password" class="text-sm font-medium text-text-muted mb-2">Пароль</label>
            <input type="password" id="password" placeholder="Введите пароль"
                   class="w-full py-[14px] px-4 rounded-field border border-border-base
                              bg-white/60 text-[15px] font-sans text-text-main outline-none
                              transition-[border-color,background] duration-200
                              focus:border-primary focus:bg-white">
        </div>

        <div id="loginError"
             class="hidden mb-3 p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm"></div>

        <button type="submit"
                class="flex items-center justify-center w-full py-4 px-5 mt-[15px]
                           rounded-field text-base font-medium font-sans text-white
                           bg-primary shadow-btn no-underline
                           transition-[background,transform] duration-200
                           hover:bg-primary-hover hover:-translate-y-px
                           active:translate-y-0">
            Войти в аккаунт
        </button>
    </form>
</div>

<a href="index.html" title="Вернуться назад"
   class="fixed bottom-10 right-10 w-14 h-14 rounded-full
              bg-primary text-white
              flex items-center justify-center text-[26px]
              shadow-back no-underline z-[100]
              transition-[background,transform,box-shadow] duration-200
              hover:bg-primary-hover hover:-translate-y-0.5 hover:shadow-back-hover
              active:translate-y-0
              max-sm:bottom-[25px] max-sm:right-[25px] max-sm:w-12 max-sm:h-12 max-sm:text-[22px]">
    <i class="ph ph-arrow-left"></i>
</a>

<script>
    (function() {
        const params = new URLSearchParams(window.location.search);
        const role = params.get('role') || 'teacher';
        const isStudent = role === 'student';

        const titleEl = document.getElementById('role-title');
        if (titleEl) titleEl.textContent = isStudent ? 'студента' : 'преподавателя';

        document.title = (isStudent
            ? 'Вход в аккаунт студента'
            : 'Вход в аккаунт преподавателя') + ' - СТАНКИН';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login    = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value.trim();
            const errEl    = document.getElementById('loginError');

            errEl.classList.add('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });

                if (!res.ok) {
                    errEl.textContent = 'Неверный логин или пароль';
                    errEl.classList.remove('hidden');
                    return;
                }

                const user = await res.json();
                localStorage.setItem('currentUser', JSON.stringify(user));

                if (user.role === 'admin')        location.href = 'adminPan.html';
                else if (user.role === 'teacher') location.href = 'chatT.html';
                else                              location.href = 'chatS.html';

            } catch (err) {
                errEl.textContent = 'Ошибка соединения с сервером';
                errEl.classList.remove('hidden');
            }
        });
    })();
</script>
</body>
</html>
