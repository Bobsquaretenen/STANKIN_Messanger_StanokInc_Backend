<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - СТАНКИН</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4a5a90',
                        'primary-hover': '#3b4d96',
                        'text-main': '#1f2937',
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body class="font-sans h-screen flex items-center justify-center relative overflow-hidden text-text-main
             bg-[linear-gradient(135deg,#e0e7ff_0%,#f3e8ff_50%,#dbeafe_100%)]">

<div class="absolute top-10 left-10 flex items-center z-10">
    <img src="logo-stankin.png" alt="СТАНКИН" class="h-[50px] w-auto object-contain">
</div>

<div class="bg-white/70 backdrop-blur-md border border-white/80 rounded-[18px]
                px-[60px] py-[50px] w-full max-w-[420px]
                shadow-[0_10px_25px_-5px_rgba(0,0,0,0.1),0_8px_10px_-6px_rgba(0,0,0,0.05)]
                flex flex-col items-center relative z-[5]">

    <h1 class="text-2xl font-semibold mb-[35px] text-text-main text-center">
        Войти как
    </h1>

    <div class="w-full flex flex-col gap-[15px]">

        <a href="loginToAccountG.html?role=teacher" class="no-underline">
            <button class="w-full px-5 py-4 rounded-xl text-base font-medium
                               text-white bg-primary
                               shadow-[0_4px_6px_-1px_rgba(74,90,144,0.3)]
                               transition-all duration-200
                               hover:bg-primary-hover hover:-translate-y-px
                               active:translate-y-0">
                Преподаватель
            </button>
        </a>

        <div class="flex items-center text-gray-400 text-sm font-medium my-[5px]
                        before:content-[''] before:flex-1 before:h-px before:bg-gray-300
                        after:content-[''] after:flex-1 after:h-px after:bg-gray-300">
            <span class="px-[15px]">или</span>
        </div>

        <a href="loginToAccountG.html?role=student" class="no-underline">
            <button class="w-full px-5 py-4 rounded-xl text-base font-medium
                               text-white bg-primary
                               shadow-[0_4px_6px_-1px_rgba(74,90,144,0.3)]
                               transition-all duration-200
                               hover:bg-primary-hover hover:-translate-y-px
                               active:translate-y-0">
                Студент
            </button>
        </a>

        <div class="flex items-center text-gray-400 text-sm font-medium my-[5px]
                        before:content-[''] before:flex-1 before:h-px before:bg-gray-300
                        after:content-[''] after:flex-1 after:h-px after:bg-gray-300">
            <span class="px-[15px]">или</span>
        </div>

        <a href="loginToAccountG.html?role=admin" class="no-underline">
            <button class="w-full px-5 py-4 rounded-xl text-base font-medium
                               text-white bg-primary
                               shadow-[0_4px_6px_-1px_rgba(74,90,144,0.3)]
                               transition-all duration-200
                               hover:bg-primary-hover hover:-translate-y-px
                               active:translate-y-0">
                Администратор
            </button>
        </a>
    </div>
</div>

<script>
    // Если пользователь уже вошёл — сразу редиректим по роли
    const u = JSON.parse(localStorage.getItem('currentUser') || 'null');
    if (u) {
        if (u.role === 'admin')        location.href = 'adminPan.html';
        else if (u.role === 'teacher') location.href = 'chatT.html';
        else                           location.href = 'chatS.html';
    }
</script>
</body>
</html>
